<head>
  <meta charset="utf-8">

  <title>ניהול | פנינת הסלולר</title>

  <style>
    :root{--navy:#0a2f5c;--blue:#1a6fd1;--sky:#e8f2fd;--line:#cfe2f7;--ink:#12243a;--muted:#5b6b7f;--bg:#f3f7fb;--red:#c92a2a;--green:#1f9d55;
      font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    img{max-width:100%;display:block}
    :focus-visible{outline:3px solid #ffb703;outline-offset:2px}
    [hidden]{display:none!important}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;font-weight:600;color:#fff;background:var(--blue);text-decoration:none}
    .btn:hover{background:#1559ab}
    .btn[disabled]{background:#aab6c4;cursor:not-allowed}
    .btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line)} .btn-ghost:hover{background:var(--sky)}
    .btn-danger{background:#fff;color:var(--red);border:1px solid #f0c4c4} .btn-danger:hover{background:#fdeeee}
    .btn-sm{padding:6px 12px;font-size:.9rem}

    /* login */
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
    .login-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;width:min(420px,100%)}
    .login-card img{height:50px;border-radius:8px;margin:0 auto 14px}
    .login-card h1{margin:0 0 4px;font-size:1.4rem;color:var(--navy);text-align:center}
    .login-card p.sub{margin:0 0 16px;text-align:center;color:var(--muted)}

    .field{display:grid;gap:4px;margin-bottom:12px}
    .field label{font-weight:500;font-size:.92rem}
    .field small{color:var(--muted)}
    .field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=url],.field input[type=password],
    .field input[type=number],.field select,.field textarea{padding:10px 12px;border:1px solid #b9cde4;border-radius:10px;width:100%;background:#fff}
    .field textarea{resize:vertical}
    .check{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:500}
    .check input{width:20px;height:20px}
    .msg{min-height:1.4em;margin:0 0 10px;font-weight:500}
    .msg.err{color:var(--red)} .msg.ok{color:var(--green)}
    .linkbtn{background:none;border:0;color:var(--blue);padding:0;text-decoration:underline}

    /* app */
    .topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
    .topbar-in{max-width:1100px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .topbar h1{margin:0;font-size:1.15rem;flex:1}
    .topbar .who{font-size:.85rem;color:#cfe2f7}
    .topbar .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
    .topbar .btn-ghost:hover{background:rgba(255,255,255,.12)}
    .tabs{max-width:1100px;margin:auto;display:flex;gap:4px;padding:0 10px;overflow-x:auto}
    .tab{background:transparent;border:0;color:#cfe2f7;padding:12px 16px;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap}
    .tab[aria-selected="true"]{color:#fff;border-bottom-color:#ffb703}
    .pill{background:#ffb703;color:#3b2a00;border-radius:999px;font-size:.75rem;padding:1px 8px;margin-inline-start:6px}

    main{max-width:1100px;margin:auto;padding:16px 14px 60px}
    .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
    .bar input,.bar select{padding:10px 12px;border:1px solid #b9cde4;border-radius:10px;background:#fff}
    .bar input[type=search]{flex:1;min-width:160px}
    .list{display:grid;gap:10px}
    .row{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
    .row.nothumb{grid-template-columns:1fr auto}
    .row .thumb{width:64px;height:64px;border-radius:10px;background:var(--sky);object-fit:contain;padding:3px}
    .row h3{margin:0;font-size:1rem}
    .meta{color:var(--muted);font-size:.88rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .tag{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--sky);color:var(--navy)}
    .tag.off{background:#eee;color:#666} .tag.warn{background:#fff1d6;color:#8a5a00} .tag.good{background:#dff5e8;color:#136b3a}
    .row-actions{display:flex;gap:6px}
    @media(max-width:560px){.row{grid-template-columns:56px 1fr}.row.nothumb{grid-template-columns:1fr}.row-actions{grid-column:1/-1}.row .thumb{width:56px;height:56px}}
    .empty{text-align:center;color:var(--muted);padding:40px 10px;background:#fff;border:1px dashed var(--line);border-radius:14px}

    .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
    .panel h2{margin:0 0 12px;font-size:1.1rem;color:var(--navy)}
    .grid2{display:grid;gap:0 14px;grid-template-columns:1fr}
    @media(min-width:700px){.grid2{grid-template-columns:1fr 1fr}}
    .savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 6px;display:flex;gap:12px;align-items:center}

    dialog{border:0;border-radius:16px;padding:0;width:min(620px,94vw);max-height:90vh;color:var(--ink)}
    dialog::backdrop{background:rgba(7,28,54,.55)}
    .dlg-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--navy);color:#fff}
    .dlg-head h2{margin:0;font-size:1.1rem}
    .dlg-head button{background:none;border:0;color:#fff;font-size:1.6rem;line-height:1}
    .dlg-body{padding:18px;overflow:auto;max-height:calc(90vh - 56px)}
    .preview{width:110px;height:110px;object-fit:contain;background:var(--sky);border-radius:12px;padding:4px}
    .upload-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .items{width:100%;border-collapse:collapse;margin:8px 0;font-size:.92rem}
    .items th,.items td{text-align:start;padding:6px 8px;border-bottom:1px solid var(--line)}
    .order-detail{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:999px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  </style>
</head>

  <main>
    <!-- מוצרים -->
    <section id="tab-products">
      <div class="bar">
        <input type="search" id="pSearch" placeholder="חיפוש מוצר…" aria-label="חיפוש מוצר">
        <select id="pCatFilter" aria-label="סינון לפי קטגוריה"></select>
        <button class="btn" id="addProduct">+ מוצר חדש</button>
      </div>
      <div class="list" id="productList"></div>
    </section>

    <!-- קטגוריות -->
    <section id="tab-categories" hidden>
      <div class="bar"><button class="btn" id="addCategory">+ קטגוריה חדשה</button></div>
      <div class="list" id="categoryList"></div>
    </section>

    <!-- הגדרות -->
    <section id="tab-settings" hidden>
      <form id="settingsForm"></form>
    </section>

    <!-- הזמנות -->
    <section id="tab-orders" hidden>
      <div class="list" id="orderList"></div>
    </section>
  </main>
</div>

  <div class="dlg-head"><h2 id="pDlgTitle">מוצר</h2><button type="button" data-close aria-label="סגור">×</button></div>
  <div class="dlg-body">
    <form id="productForm" novalidate>
      <input type="hidden" id="p_id">
      <div class="field"><label for="p_name">שם המוצר *</label><input type="text" id="p_name" required></div>
      <div class="field"><label for="p_cat">קטגוריה</label><select id="p_cat"></select></div>
      <div class="grid2">
        <div class="field"><label for="p_price">מחיר (₪) *</label><input type="number" id="p_price" min="0" step="0.01" inputmode="decimal" required></div>
        <div class="field"><label for="p_sale">מחיר מבצע (₪)</label><input type="number" id="p_sale" min="0" step="0.01" inputmode="decimal"><small>השאירו ריק אם אין מבצע.</small></div>
      </div>
      <div class="field"><label for="p_desc">תיאור</label><textarea id="p_desc" rows="3"></textarea></div>

            <input type="url" id="p_url" placeholder="https://…" style="margin-top:4px;padding:10px 12px;border:1px solid #b9cde4;border-radius:10px;width:100%">
          </div>
        </div>
      </div>
      <div class="grid2">
        <div class="field"><label for="p_sort">סדר תצוגה</label><input type="number" id="p_sort" step="1" value="0"><small>מספר קטן = מופיע קודם.</small></div>

          <label class="check"><input type="checkbox" id="p_stock" checked> במלאי</label>

<!-- חלון קטגוריה -->
<dialog id="categoryDialog">
  <div class="dlg-head"><h2 id="cDlgTitle">קטגוריה</h2><button type="button" data-close aria-label="סגור">×</button></div>
  <div class="dlg-body">
    <form id="categoryForm" novalidate>
      <input type="hidden" id="c_id">
      <div class="field"><label for="c_name">שם הקטגוריה *</label><input type="text" id="c_name" required></div>
      <div class="field"><label for="c_slug">כתובת (באנגלית)</label><input type="text" id="c_slug" dir="ltr" placeholder="nokia"><small>מופיע בקישור: ?cat=nokia. אותיות קטנות, מספרים ומקף בלבד. ריק = ייווצר אוטומטית.</small></div>
      <div class="field"><label for="c_desc">תיאור קצר</label><textarea id="c_desc" rows="2"></textarea></div>
      <div class="grid2">
        <div class="field"><label for="c_sort">סדר תצוגה</label><input type="number" id="c_sort" step="1" value="0"></div>
        <div><label class="check" style="margin-top:28px"><input type="checkbox" id="c_active" checked> מוצגת באתר</label></div>
      </div>
      <p class="msg" id="cMsg" role="alert"></p>
      <div style="display:flex;gap:10px"><button class="btn" type="submit" id="cSave">שמירה</button><button class="btn btn-ghost" type="button" data-close>ביטול</button></div>
    </form>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = (n) => '₪' + Number(n).toLocaleString('he-IL', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
  const fmtDate = (d) => new Date(d).toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' });
  const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' fill='#e8f2fd'/><rect x='40' y='20' width='40' height='80' rx='8' fill='none' stroke='#8fb0d6' stroke-width='4'/></svg>");
  const imgFallback = `this.onerror=null;this.src='${PLACEHOLDER.replace(/'/g, '%27')}'`;

  const CFG = window.PEARL_CONFIG;
  const db = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  const state = { products: [], cats: [], orders: [], settings: {} };
  const views = { login: $('#loginView'), noAccess: $('#noAccessView'), app: $('#appView') };
  const show = (name) => Object.entries(views).forEach(([k, el]) => el.hidden = k !== name);

  function toast(text) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = text; t.setAttribute('role', 'status');
    document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
  }
  const dbError = (e) => 'שגיאה: ' + (e?.message || 'נסו שוב');

  /* ============ התחברות ============ */
  let loginMode = 'login'; // login | forgot | recovery
  const authErr = (m = '') =>
    /Invalid login/i.test(m) ? 'מייל או סיסמה שגויים.' :
    /not confirmed/i.test(m) ? 'המייל טרם אושר. בדקו את תיבת הדואר.' :
    /Password should/i.test(m) ? 'הסיסמה קצרה מדי (לפחות 6 תווים).' :
    /rate limit|too many/i.test(m) ? 'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.' : 'אירעה שגיאה. נסו שוב.';

  function setLoginMode(mode) {
    loginMode = mode;
    const m = $('#loginMsg'); m.textContent = ''; m.className = 'msg';
    $('#fEmail').hidden = mode === 'recovery';
    $('#fPass').hidden = mode === 'forgot';
    $('#l_pass').autocomplete = mode === 'recovery' ? 'new-password' : 'current-password';
    $('#loginTitle').textContent = { login: 'כניסת מנהל', forgot: 'איפוס סיסמה', recovery: 'בחירת סיסמה חדשה' }[mode];
    $('#loginSub').textContent = { login: 'התחברו עם המייל והסיסמה שלכם.', forgot: 'נשלח לכם קישור לבחירת סיסמה חדשה.', recovery: 'בחרו סיסמה חדשה (לפחות 6 תווים).' }[mode];
    $('#loginBtn').textContent = { login: 'התחברות', forgot: 'שלחו לי קישור', recovery: 'שמירת סיסמה' }[mode];
    $('#forgotBtn').textContent = mode === 'login' ? 'שכחתי סיסמה' : 'חזרה להתחברות';
    $('#forgotBtn').hidden = mode === 'recovery';
  }
  $('#forgotBtn').addEventListener('click', () => setLoginMode(loginMode === 'login' ? 'forgot' : 'login'));

  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = $('#loginMsg'), btn = $('#loginBtn');
    const email = $('#l_email').value.trim(), pass = $('#l_pass').value;
    msg.className = 'msg err'; msg.textContent = '';
    btn.disabled = true;
    try {
      if (loginMode === 'login') {
        if (!email || !pass) { msg.textContent = 'יש למלא מייל וסיסמה.'; return; }
        const { error } = await db.auth.signInWithPassword({ email, password: pass });
        if (error) msg.textContent = authErr(error.message);
      } else if (loginMode === 'forgot') {
        if (!email) { msg.textContent = 'יש להזין מייל.'; return; }
        const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
        if (error) msg.textContent = authErr(error.message);
        else { msg.className = 'msg ok'; msg.textContent = 'אם המייל קיים אצלנו, נשלח אליו קישור לאיפוס.'; }
      } else {
        if (pass.length < 6) { msg.textContent = 'הסיסמה חייבת להכיל לפחות 6 תווים.'; return; }
        const { error } = await db.auth.updateUser({ password: pass });
        if (error) msg.textContent = authErr(error.message);
        else { toast('הסיסמה עודכנה'); $('#l_pass').value = ''; recovering = false; setLoginMode('login'); await route(); }
      }
    } finally { btn.disabled = false; }
  });

  $('#logoutBtn').addEventListener('click', () => db.auth.signOut());
  $('#noAccessLogout').addEventListener('click', () => db.auth.signOut());

  /* ============ ניתוב לפי מצב התחברות ============ */
  let routing = false, booted = false, recovering = false;
  async function route() {
    if (routing || recovering) return; routing = true;
    try {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { setLoginMode('login'); show('login'); return; }
      const { data: isAdmin } = await db.rpc('is_admin');
      if (!isAdmin) { $('#noAccessWho').textContent = `המשתמש ${session.user.email} אינו מנהל.`; show('noAccess'); return; }
      $('#whoAmI').textContent = session.user.email;
      show('app');
      if (!booted) { booted = true; await loadAll(); }
    } finally { routing = false; }
  }
  db.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') { recovering = true; show('login'); setLoginMode('recovery'); }
    else if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') { if (event === 'SIGNED_OUT') booted = false; setTimeout(route, 0); }
  });

  /* ============ טעינה ============ */
  async function loadAll() {
    await Promise.all([loadCats(), loadSettings(), loadOrders()]);
    await loadProducts();
  }
  async function loadCats() {
    const { data, error } = await db.from('categories').select('*').order('sort_order').order('name');
    if (error) return toast(dbError(error));
    state.cats = data || []; renderCats(); fillCatSelects();
  }
  async function loadProducts() {
    const { data, error } = await db.from('products').select('*').order('sort_order').order('created_at', { ascending: false });
    if (error) return toast(dbError(error));
    state.products = data || []; renderProducts();
  }
  async function loadSettings() {
    const { data, error } = await db.from('settings').select('key,value');
    if (error) return toast(dbError(error));
    state.settings = Object.fromEntries((data || []).map(r => [r.key, r.value])); renderSettings();
  }
  async function loadOrders() {
    const { data, error } = await db.from('orders').select('*, order_items(*)').order('created_at', { ascending: false }).limit(150);
    if (error) return toast(dbError(error));
    state.orders = data || []; renderOrders();
  }

  /* ============ טאבים ============ */
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t));
    ['products', 'categories', 'settings', 'orders'].forEach(n => $('#tab-' + n).hidden = n !== t.dataset.tab);
  }));

  /* ============ דיאלוגים ============ */
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-close]')) e.target.closest('dialog').close();
    else if (e.target instanceof HTMLDialogElement) e.target.close();
  });

  /* ============ מוצרים ============ */
  const catName = (id) => state.cats.find(c => c.id === id)?.name || 'ללא קטגוריה';

  function fillCatSelects() {
    $('#p_cat').innerHTML = '<option value="">ללא קטגוריה</option>' + state.cats.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
    const cur = $('#pCatFilter').value;
    $('#pCatFilter').innerHTML = '<option value="">כל הקטגוריות</option>' + state.cats.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
    $('#pCatFilter').value = cur;
  }

  function renderProducts() {
    const q = $('#pSearch').value.trim().toLowerCase(), cat = $('#pCatFilter').value;
    const list = state.products.filter(p => (!cat || p.category_id === cat) && (!q || p.name.toLowerCase().includes(q)));
    $('#productList').innerHTML = list.length ? list.map(p => `
      <div class="row" data-id="${esc(p.id)}">
        <img class="thumb" src="${esc(p.image_url || PLACEHOLDER)}" alt="" loading="lazy" onerror="${imgFallback}">
        <div>
          <h3>${esc(p.name)}</h3>
          <div class="meta">
            <b style="color:var(--navy)">${p.sale_price != null ? money(p.sale_price) + ' <s style="font-weight:400">' + money(p.price) + '</s>' : money(p.price)}</b>
            <span>${esc(catName(p.category_id))}</span>
            ${p.in_stock ? '' : '<span class="tag warn">אזל מהמלאי</span>'}
            ${p.is_active ? '' : '<span class="tag off">מוסתר</span>'}
          </div>
        </div>
        <div class="row-actions">
          <button class="btn btn-ghost btn-sm" data-edit>עריכה</button>
          <button class="btn btn-danger btn-sm" data-del>מחיקה</button>
        </div>
      </div>`).join('') : '<p class="empty">אין מוצרים להצגה. לחצו על "מוצר חדש" כדי להתחיל.</p>';
  }
  $('#pSearch').addEventListener('input', renderProducts);
  $('#pCatFilter').addEventListener('change', renderProducts);

  function openProduct(p) {
    $('#pDlgTitle').textContent = p ? 'עריכת מוצר' : 'מוצר חדש';
    $('#p_id').value = p?.id || '';
    $('#p_name').value = p?.name || '';
    $('#p_cat').value = p?.category_id || ($('#pCatFilter').value || '');
    $('#p_price').value = p?.price ?? '';
    $('#p_sale').value = p?.sale_price ?? '';
    $('#p_desc').value = p?.description || '';
    $('#p_url').value = p?.image_url || '';
    $('#p_file').value = '';
    $('#p_sort').value = p?.sort_order ?? 0;
    $('#p_stock').checked = p ? p.in_stock : true;
    $('#p_active').checked = p ? p.is_active : true;
    $('#pMsg').textContent = '';
    updatePreview();
    $('#productDialog').showModal();
    $('#p_name').focus();
  }
  function updatePreview(src) {
    const img = $('#p_preview'), url = src || $('#p_url').value.trim();
    img.hidden = !url; if (url) img.src = url;
  }
  $('#p_url').addEventListener('input', () => updatePreview());
  $('#p_file').addEventListener('change', (e) => { const f = e.target.files[0]; if (f) updatePreview(URL.createObjectURL(f)); });
  $('#addProduct').addEventListener('click', () => openProduct(null));

  $('#productList').addEventListener('click', async (e) => {
    const row = e.target.closest('.row'); if (!row) return;
    const p = state.products.find(x => x.id === row.dataset.id); if (!p) return;
    if (e.target.closest('[data-edit]')) openProduct(p);
    if (e.target.closest('[data-del]')) {
      if (!confirm(`למחוק את "${p.name}"? אי אפשר לשחזר.\n(אם רוצים רק להסתיר מהאתר – ערכו ובטלו את "מוצג באתר".)`)) return;
      const { error } = await db.from('products').delete().eq('id', p.id);
      if (error) return toast(dbError(error));
      toast('המוצר נמחק'); loadProducts();
    }
  });

  async function shrink(file, max = 1000) {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
  }

  $('#productForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = $('#pMsg'), btn = $('#pSave'); msg.className = 'msg err'; msg.textContent = '';
    const name = $('#p_name').value.trim(), price = parseFloat($('#p_price').value);
    const saleRaw = $('#p_sale').value.trim(), sale = saleRaw === '' ? null : parseFloat(saleRaw);
    if (!name) { msg.textContent = 'יש להזין שם מוצר.'; return; }
    if (!(price >= 0)) { msg.textContent = 'יש להזין מחיר תקין.'; return; }
    if (sale !== null && !(sale >= 0 && sale < price)) { msg.textContent = 'מחיר מבצע חייב להיות נמוך מהמחיר הרגיל.'; return; }

    btn.disabled = true; btn.textContent = 'שומר…';
    try {
      let image_url = $('#p_url').value.trim() || null;
      const file = $('#p_file').files[0];
      if (file) {
        const blob = await shrink(file);
        const path = `${crypto.randomUUID()}.jpg`;
        const up = await db.storage.from('product-images').upload(path, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
        if (up.error) throw up.error;
        image_url = db.storage.from('product-images').getPublicUrl(path).data.publicUrl;
      }
      const row = {
        name, price, sale_price: sale, image_url,
        category_id: $('#p_cat').value || null,
        description: $('#p_desc').value.trim() || null,
        sort_order: parseInt($('#p_sort').value, 10) || 0,
        in_stock: $('#p_stock').checked, is_active: $('#p_active').checked
      };
      const id = $('#p_id').value;
      const { error } = id ? await db.from('products').update(row).eq('id', id) : await db.from('products').insert(row);
      if (error) throw error;
      $('#productDialog').close(); toast('המוצר נשמר'); loadProducts();
    } catch (err) { msg.textContent = dbError(err); }
    finally { btn.disabled = false; btn.textContent = 'שמירה'; }
  });

  /* ============ קטגוריות ============ */
  function renderCats() {
    $('#categoryList').innerHTML = state.cats.length ? state.cats.map(c => {
      const n = state.products.filter(p => p.category_id === c.id).length;
      return `
      <div class="row nothumb" data-id="${esc(c.id)}">
        <div>
          <h3>${esc(c.name)}</h3>
          <div class="meta"><span dir="ltr">?cat=${esc(c.slug)}</span><span>סדר: ${c.sort_order}</span>
            ${c.is_active ? '<span class="tag good">מוצגת</span>' : '<span class="tag off">מוסתרת</span>'}</div>
        </div>
        <div class="row-actions">
          <button class="btn btn-ghost btn-sm" data-edit>עריכה</button>
          <button class="btn btn-danger btn-sm" data-del>מחיקה</button>
        </div>
      </div>`;
    }).join('') : '<p class="empty">אין קטגוריות. הוסיפו את הראשונה.</p>';
  }
  function openCategory(c) {
    $('#cDlgTitle').textContent = c ? 'עריכת קטגוריה' : 'קטגוריה חדשה';
    $('#c_id').value = c?.id || ''; $('#c_name').value = c?.name || ''; $('#c_slug').value = c?.slug || '';
    $('#c_desc').value = c?.description || ''; $('#c_sort').value = c?.sort_order ?? (state.cats.length + 1);
    $('#c_active').checked = c ? c.is_active : true; $('#cMsg').textContent = '';
    $('#categoryDialog').showModal(); $('#c_name').focus();
  }
  $('#addCategory').addEventListener('click', () => openCategory(null));
  $('#categoryList').addEventListener('click', async (e) => {
    const row = e.target.closest('.row'); if (!row) return;
    const c = state.cats.find(x => x.id === row.dataset.id); if (!c) return;
    if (e.target.closest('[data-edit]')) openCategory(c);
    if (e.target.closest('[data-del]')) {
      const n = state.products.filter(p => p.category_id === c.id).length;
      if (!confirm(`למחוק את הקטגוריה "${c.name}"?` + (n ? `\n${n} מוצרים שבה יישארו ללא קטגוריה.` : ''))) return;
      const { error } = await db.from('categories').delete().eq('id', c.id);
      if (error) return toast(dbError(error));
      toast('הקטגוריה נמחקה'); await loadCats(); loadProducts();
    }
  });
  $('#categoryForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = $('#cMsg'), btn = $('#cSave'); msg.className = 'msg err'; msg.textContent = '';
    const name = $('#c_name').value.trim();
    let slug = $('#c_slug').value.trim().toLowerCase().replace(/\s+/g, '-');
    if (!name) { msg.textContent = 'יש להזין שם לקטגוריה.'; return; }
    if (!slug) slug = 'cat-' + Date.now().toString(36);
    if (!/^[a-z0-9-]+$/.test(slug)) { msg.textContent = 'הכתובת יכולה להכיל רק אותיות אנגליות קטנות, מספרים ומקף.'; return; }
    btn.disabled = true;
    const row = { name, slug, description: $('#c_desc').value.trim() || null, sort_order: parseInt($('#c_sort').value, 10) || 0, is_active: $('#c_active').checked };
    const id = $('#c_id').value;
    const { error } = id ? await db.from('categories').update(row).eq('id', id) : await db.from('categories').insert(row);
    btn.disabled = false;
    if (error) { msg.textContent = /duplicate/i.test(error.message) ? 'כתובת זו כבר בשימוש בקטגוריה אחרת.' : dbError(error); return; }
    $('#categoryDialog').close(); toast('הקטגוריה נשמרה'); loadCats();
  });

  /* ============ הגדרות ותוכן ============ */
  // private = לא נחשף לגולשים באתר
  const SECTIONS = [
    { title: 'פרטי החנות', fields: [
      { key: 'store_name', label: 'שם החנות', type: 'text' },
      { key: 'store_phone', label: 'טלפון החנות (מוצג באתר)', type: 'tel' },
      { key: 'store_address', label: 'כתובת החנות', type: 'text' },
      { key: 'opening_hours', label: 'שעות פעילות', type: 'textarea', rows: 4, hint: 'שורה לכל יום, למשל: א׳–ה׳: 09:00–19:00' }
    ]},
    { title: 'מנהל ויצירת קשר', fields: [
      { key: 'admin_phone', label: 'טלפון המנהל (פנימי, לא מוצג באתר)', type: 'tel', private: true },
      { key: 'order_email', label: 'מייל המנהל – לשם נשלחות הזמנות חדשות (פנימי)', type: 'email', private: true },
      { key: 'whatsapp_number', label: 'מספר וואטסאפ', type: 'tel', hint: 'אפשר לכתוב 050-1234567 או 972501234567.' },
      { key: 'whatsapp_enabled', label: 'הצג כפתור וואטסאפ באתר ובהזמנה', type: 'bool' }
    ]},
    { title: 'תשלום', fields: [
      { key: 'payment_enabled', label: 'הצג כפתור סליקה בסיום ההזמנה', type: 'bool' },
      { key: 'payment_label', label: 'טקסט על כפתור הסליקה', type: 'text' },
      { key: 'payment_url', label: 'קישור לדף התשלום של חברת הסליקה', type: 'url' },
      { key: 'bit_enabled', label: 'הצג כפתור ביט בסיום ההזמנה', type: 'bool' },
      { key: 'bit_label', label: 'טקסט על כפתור ביט', type: 'text' },
      { key: 'bit_url', label: 'קישור תשלום ביט', type: 'url' }
    ]},
    { title: 'מדיניות ותקנון', fields: [
      { key: 'return_policy', label: 'מדיניות החזרות', type: 'textarea', rows: 6 },
      { key: 'shipping_policy', label: 'מדיניות משלוחים', type: 'textarea', rows: 6 },
      { key: 'terms', label: 'תקנון האתר', type: 'textarea', rows: 12 }
    ]}
  ];
  const ALL_FIELDS = SECTIONS.flatMap(s => s.fields);

  function renderSettings() {
    const f = $('#settingsForm');
    f.innerHTML = SECTIONS.map(sec => `
      <div class="panel"><h2>${esc(sec.title)}</h2><div class="${sec.fields.some(x => x.type === 'textarea') ? '' : 'grid2'}">
      ${sec.fields.map(fl => {
        const v = state.settings[fl.key] ?? '', id = 's_' + fl.key;
        if (fl.type === 'bool') return `<label class="check"><input type="checkbox" id="${id}" ${String(v).toLowerCase() === 'true' ? 'checked' : ''}> ${esc(fl.label)}</label>`;
        const input = fl.type === 'textarea'
          ? `<textarea id="${id}" rows="${fl.rows || 3}">${esc(v)}</textarea>`
          : `<input id="${id}" type="${fl.type}" value="${esc(v)}" ${fl.type === 'url' || fl.type === 'email' ? 'dir="ltr"' : ''}>`;
        return `<div class="field"><label for="${id}">${esc(fl.label)}</label>${input}${fl.hint ? `<small>${esc(fl.hint)}</small>` : ''}</div>`;
      }).join('')}
      </div></div>`).join('') +
      '<div class="savebar"><button class="btn" type="submit" id="sSave">שמירת כל ההגדרות</button><span class="msg" id="sMsg" role="status"></span></div>';
  }
  $('#settingsForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#sSave'), msg = $('#sMsg'); btn.disabled = true; msg.className = 'msg'; msg.textContent = '';
    const now = new Date().toISOString();
    const rows = ALL_FIELDS.map(fl => {
      const el = $('#s_' + fl.key);
      const value = fl.type === 'bool' ? String(el.checked) : el.value.trim();
      return { key: fl.key, value, label: fl.label, is_public: !fl.private, updated_at: now };
    });
    const { error } = await db.from('settings').upsert(rows, { onConflict: 'key' });
    btn.disabled = false;
    if (error) { msg.className = 'msg err'; msg.textContent = dbError(error); return; }
    rows.forEach(r => state.settings[r.key] = r.value);
    msg.className = 'msg ok'; msg.textContent = 'נשמר ✓'; toast('ההגדרות נשמרו');
  });

  /* ============ הזמנות ============ */
  const STATUS = { new: 'חדשה', paid: 'שולמה', shipped: 'נשלחה', done: 'הושלמה', cancelled: 'בוטלה' };
  function renderOrders() {
    const fresh = state.orders.filter(o => o.status === 'new').length;
    $('#newOrders').hidden = !fresh; $('#newOrders').textContent = fresh;
    $('#orderList').innerHTML = state.orders.length ? state.orders.map(o => `
      <div class="row nothumb" data-id="${esc(o.id)}">
        <div>
          <h3>#${o.order_number} · ${esc(o.customer_name)} · ${money(o.total)}</h3>
          <div class="meta"><span>${fmtDate(o.created_at)}</span><span dir="ltr">${esc(o.customer_phone)}</span>
            <span class="tag ${o.status === 'new' ? 'warn' : o.status === 'cancelled' ? 'off' : 'good'}">${esc(STATUS[o.status] || o.status)}</span></div>
        </div>
        <div class="row-actions">
          <select data-status aria-label="סטטוס הזמנה">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === o.status ? 'selected' : ''}>${v}</option>`).join('')}</select>
          <button class="btn btn-ghost btn-sm" data-toggle>פרטים</button>
          <button class="btn btn-danger btn-sm" data-del>מחיקה</button>
        </div>
        <div class="order-detail" hidden>
          <p style="margin:0 0 6px">
            <b>שם:</b> ${esc(o.customer_name)}<br>
            <b>טלפון:</b> <a href="tel:${esc(o.customer_phone)}">${esc(o.customer_phone)}</a><br>
            <b>מייל:</b> ${esc(o.customer_email || '—')}<br>
            <b>כתובת:</b> ${esc(o.customer_address)}<br>
            ${o.notes ? `<b>הערות:</b> ${esc(o.notes)}` : ''}
          </p>
          <table class="items"><tr><th>מוצר</th><th>כמות</th><th>מחיר</th></tr>
            ${(o.order_items || []).map(i => `<tr><td>${esc(i.product_name)}</td><td>${i.quantity}</td><td>${money(i.unit_price * i.quantity)}</td></tr>`).join('')}
          </table>
        </div>
      </div>`).join('') : '<p class="empty">עדיין אין הזמנות.</p>';
  }
  $('#orderList').addEventListener('click', async (e) => {
    const row = e.target.closest('.row'); if (!row) return;
    const o = state.orders.find(x => x.id === row.dataset.id); if (!o) return;
    if (e.target.closest('[data-toggle]')) { const d = $('.order-detail', row); d.hidden = !d.hidden; }
    if (e.target.closest('[data-del]')) {
      if (!confirm(`למחוק את הזמנה #${o.order_number} של ${o.customer_name}?`)) return;
      const { error } = await db.from('orders').delete().eq('id', o.id);
      if (error) return toast(dbError(error));
      toast('ההזמנה נמחקה'); loadOrders();
    }
  });
  $('#orderList').addEventListener('change', async (e) => {
    if (!e.target.matches('[data-status]')) return;
    const row = e.target.closest('.row'); const o = state.orders.find(x => x.id === row.dataset.id);
    const { error } = await db.from('orders').update({ status: e.target.value }).eq('id', o.id);
    if (error) return toast(dbError(error));
    o.status = e.target.value; toast('הסטטוס עודכן'); renderOrders();
  });

  /* ============ התחלה ============ */
  route();
})();
</script>
</body>
</html>
